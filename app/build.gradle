plugins {
    id 'com.android.application'
}

android {
    namespace 'com.titan2elite.tristatusbar'
    compileSdk 34

    defaultConfig {
        applicationId 'com.titan2elite.tristatusbar'
        minSdk 33
        targetSdk 34
        versionCode 21
        versionName '1.3.14'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    compileOnly files('libs/xposed-api-82.jar')
}
